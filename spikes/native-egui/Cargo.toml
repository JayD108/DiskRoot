[package]
name = "xylem-native-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Stand-alone: not part of the main workspace (keeps main builds fast).
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
