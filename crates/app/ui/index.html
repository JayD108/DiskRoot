<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drishti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="currentColor"/>
        <path d="M16 6a10 10 0 0 1 10 10h-4a6 6 0 0 0-6-6z" fill="var(--c1)"/>
        <path d="M26 16a10 10 0 0 1-7 9.5l-1.2-3.8A6 6 0 0 0 22 16z" fill="var(--c2)"/>
        <path d="M16 2a14 14 0 0 1 14 14h-2.5A11.5 11.5 0 0 0 16 4.5z" fill="var(--c3)"/>
      </svg>
      <span>Drishti</span>
    </div>
    <form class="scan" id="scanForm" autocomplete="off">
      <input id="path" list="drives" spellcheck="false" aria-label="Drive or folder to scan" placeholder="C:\ or a folder path">
      <datalist id="drives"></datalist>
      <button type="submit" id="scanBtn" class="btn primary">Scan</button>
      <button type="button" id="adminBtn" class="btn" title="Reads the NTFS Master File Table directly: much faster, and includes protected system folders. Windows will ask for admin permission.">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1 3 9h4l-1 6 6-8H8z" fill="currentColor"/></svg>
        Fast scan (admin)
      </button>
    </form>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="crumbbar">
    <ol class="crumbs" id="crumbs"></ol>
    <div class="seg" id="cmodeSeg" role="group" aria-label="Group by">
      <button type="button" data-cmode="location">By location</button>
      <button type="button" data-cmode="category">By category</button>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="Diagram type">
      <button type="button" data-mode="sunburst">Sunburst</button>
      <button type="button" data-mode="treemap">Treemap</button>
    </div>
  </nav>

  <main>
    <section class="chart" id="chart">
      <canvas id="canvas"></canvas>
      <div class="empty" id="empty">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="9" fill="var(--muted)"/>
          <path d="M32 14a18 18 0 0 1 18 18h-7a11 11 0 0 0-11-11z" fill="var(--c1)"/>
          <path d="M50 32a18 18 0 0 1-12.5 17.1l-2.2-6.6A11 11 0 0 0 43 32z" fill="var(--c2)"/>
          <path d="M32 6a26 26 0 0 1 26 26h-4.5A21.5 21.5 0 0 0 32 10.5z" fill="var(--c3)"/>
        </svg>
        <h1>See what's filling your drive</h1>
        <p>Pick a drive and press <b>Scan</b>. Use <b>Fast scan (admin)</b> for whole NTFS drives: it reads the Master File Table directly and also counts protected system folders.</p>
      </div>
      <div class="busy hidden" id="busy">
        <div class="spinner"></div>
        <div id="busyText">Scanning…</div>
      </div>
    </section>
    <aside class="side">
      <div class="side-head">
        <div class="side-title" id="sideTitle">Nothing scanned yet</div>
        <div class="side-sub" id="sideSub"></div>
        <div class="legend" id="legend"></div>
      </div>
      <ol class="list" id="list"></ol>
    </aside>
  </main>

  <div class="modal hidden" id="modal">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle"></h2>
      <div id="mBody"></div>
      <div class="mActions">
        <button type="button" class="btn" id="mCancel">Cancel</button>
        <button type="button" class="btn danger" id="mOk">Move to Recycle Bin</button>
      </div>
    </div>
  </div>

  <div class="tip hidden" id="tip" role="tooltip"></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
