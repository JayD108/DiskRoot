[workspace]
resolver = "3"
members = ["crates/core", "crates/scan-walk", "crates/scan-mft", "crates/cli", "crates/bench", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
drishti-core = { path = "crates/core" }
drishti-scan-walk = { path = "crates/scan-walk" }
drishti-scan-mft = { path = "crates/scan-mft" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
