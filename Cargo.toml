[workspace]
resolver = "3"
members = ["crates/core", "crates/scan-walk", "crates/scan-mft", "crates/session", "crates/native", "crates/cli", "crates/bench"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
xylem-core = { path = "crates/core" }
xylem-scan-walk = { path = "crates/scan-walk" }
xylem-scan-mft = { path = "crates/scan-mft" }
xylem-session = { path = "crates/session" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }

[profile.release]
# Small, fast release binaries. Unwinding stays on: the folder walker
# catches panics per folder so one bad folder can't hang a scan.
lto = "fat"
codegen-units = 1
strip = true
debug = false
