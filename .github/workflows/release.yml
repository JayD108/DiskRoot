# Release pipeline. Push a tag that matches Cargo.toml's version
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run it by hand.
#
#   build exes -> [SignPath signs exes] -> installer + zip from those exes
#   -> real install/uninstall test -> [SignPath signs installer]
#   -> checksums -> GitHub Release (tags only)
#
# Signing turns on by itself once the repository secret SIGNPATH_API_TOKEN
# and the variable SIGNPATH_ORGANIZATION_ID exist.
# Every signing request still needs manual approval in SignPath. Until
# then, releases are published unsigned and say so.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release
      actions: read # SignPath reads the build artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check tag matches Cargo.toml version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME != v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --workspace

      - name: Build exes
        shell: powershell
        run: .\tools\release.ps1 -Step build

      - name: Upload exes (unsigned)
        id: upload-bin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xylem-${{ steps.ver.outputs.version }}-exes-unsigned
          path: dist/stage/*.exe
          if-no-files-found: error

      - name: Sign exes with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Xylem' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.upload-bin.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exes

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer and portable zip
        shell: powershell
        run: |
          $dir = if ($env:SIGNPATH_ENABLED -eq 'true') { 'signed-exes' } else { 'dist\stage' }
          .\tools\release.ps1 -Step package -StageDir $dir
          if ($LASTEXITCODE) { exit 1 }

      - name: Test install and uninstall
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = "$env:ProgramFiles\Xylem"
          $envKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $pathBefore = (Get-Item $envKey).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $kindBefore = (Get-Item $envKey).GetValueKind('Path')
          $p = Start-Process "dist\xylem-setup-$v.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'xylem.exe', 'xylem-cli.exe', 'uninstall.exe', 'LICENSE-MIT') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $dir\$f" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Xylem.lnk")) { throw "no Start Menu shortcut" }
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Xylem'
          if ((Get-ItemProperty $key).DisplayVersion -ne $v) { throw "uninstall entry missing or wrong version" }
          foreach ($k in "Directory","Directory\Background","Drive") { if (-not (Test-Path "HKLM:\Software\Classes\$k\shell\Xylem\command")) { throw "no right-click entry for $k" } }
          & "$dir\xylem-cli.exe" --version
          if ($LASTEXITCODE) { throw "installed xylem-cli failed" }
          $machinePath = (Get-Item $envKey).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (-not (($machinePath -split ';') -contains $dir)) { throw "install folder not on the system PATH: $machinePath" }
          if (-not $machinePath.StartsWith($pathBefore.TrimEnd(';'))) { throw "install changed other PATH entries" }
          if ((Get-Item $envKey).GetValueKind('Path') -ne $kindBefore) { throw "PATH value type changed" }
          # With the new PATH, xylem-cli is found by name (as in a fresh terminal).
          $env:Path = [Environment]::ExpandEnvironmentVariables($machinePath)
          $cmd = Get-Command xylem-cli -ErrorAction SilentlyContinue
          if (-not $cmd -or $cmd.Source -ne "$dir\xylem-cli.exe") { throw "xylem-cli not found by name" }
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { throw "install folder left behind" }
          if (Test-Path $key) { throw "uninstall entry left behind" }
          foreach ($k in "Directory","Directory\Background","Drive") { if (Test-Path "HKLM:\Software\Classes\$k\shell\Xylem") { throw "right-click entry left behind ($k)" } }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Xylem.lnk") { throw "shortcut left behind" }
          $after = (Get-Item $envKey).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($after -split ';') -contains $dir) { throw "install folder left on PATH" }
          if ($after -ne $pathBefore) { throw "PATH not restored exactly: '$after' vs '$pathBefore'" }
          "install/uninstall OK"

      - name: Upload installer (unsigned)
        id: upload-setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xylem-${{ steps.ver.outputs.version }}-installer-unsigned
          path: dist/xylem-setup-*.exe
          if-no-files-found: error

      - name: Sign installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Xylem' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Collect release files and checksums
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = if ($env:SIGNPATH_ENABLED -eq 'true') { "signed-setup\xylem-setup-$v.exe" } else { "dist\xylem-setup-$v.exe" }
          $exes = if ($env:SIGNPATH_ENABLED -eq 'true') { 'signed-exes' } else { 'dist\stage' }
          Copy-Item $setup, "dist\xylem-$v-portable.zip", "$exes\xylem.exe", "$exes\xylem-cli.exe" out
          # Fixed names too, so README links like .../releases/latest/download/xylem-setup.exe always get the newest.
          Copy-Item $setup out\xylem-setup.exe
          Copy-Item "dist\xylem-$v-portable.zip" out\xylem-portable.zip
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Join-String -Separator "`n" -OutputSuffix "`n" | ForEach-Object { [IO.File]::WriteAllText("$PWD\out\SHA256SUMS.txt", $_) }
          Get-Content out\SHA256SUMS.txt

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xylem-${{ steps.ver.outputs.version }}-release
          path: out/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $signed = if ($env:SIGNPATH_ENABLED -eq 'true') { 'Signed' } else { '**Not signed yet** (SignPath application pending). Windows SmartScreen will warn; check the SHA-256 checksums below.' }
          $notes = (Get-Content .github\release-notes.md -Raw).Replace('{{VERSION}}', $v).Replace('{{SIGNED}}', $signed)
          $notes += "`n## SHA-256 checksums`n``````n" + (Get-Content out\SHA256SUMS.txt -Raw) + "``````n"
          Set-Content -Encoding utf8 notes.md $notes
          gh release create $env:GITHUB_REF_NAME out\xylem-setup-$v.exe out\xylem-$v-portable.zip out\xylem-setup.exe out\xylem-portable.zip out\SHA256SUMS.txt --title "Xylem $v" --notes-file notes.md
